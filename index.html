<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ключалката на Хогуортс — Магическа ескейп стая</title>
<meta name="description" content="Интерактивна ескейп стая по света на Хари Потър: девет зали, девет загадки, шестдесет минути.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/rooms.css">
<link rel="stylesheet" href="css/rooms2.css">
<link rel="stylesheet" href="css/rooms3.css">
<link rel="stylesheet" href="css/rooms4.css">
<link rel="stylesheet" href="css/rooms5.css">
<link rel="stylesheet" href="css/rooms6.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>">
</head>
<body data-house="none">

<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>
<div id="dust-layer" aria-hidden="true"></div>
<div id="spell-layer" aria-hidden="true"></div>

<!-- ============ ЕКРАН: ЗАГЛАВИЕ ============ -->
<section id="screen-intro" class="screen active">
  <div class="intro-wrap">
    <div class="crest-big" id="intro-crest"></div>
    <h1 class="title-main">Ключалката на <span>Хогуортс</span></h1>
    <p class="title-sub">магическа ескейп стая в шест части</p>

    <div class="wizard-badge" id="wizard-badge" hidden></div>

    <div class="acts" id="acts"></div>

    <div class="intro-actions">
      <button class="btn btn-ghost" id="btn-howto"><span>Как се играе</span></button>
      <button class="btn btn-ghost" id="btn-stats"><span>Статистика</span></button>
      <button class="btn btn-ghost" id="btn-wipe"><span>Изтрий всичко</span></button>
    </div>
    <p class="tiny-note">Напредъкът и резултатите се пазят в твоя браузър. Няма сървър, няма база данни — само магия и <code>localStorage</code>.</p>
  </div>
</section>

<!-- ============ ЕКРАН: ПРОЛОГ НА ЧАСТТА ============ -->
<section id="screen-story" class="screen">
  <div class="intro-wrap">
    <div class="story-numeral" id="story-numeral">II</div>
    <h2 class="story-title" id="story-title"></h2>
    <div class="scroll-panel" id="story-body"></div>
    <div class="intro-actions">
      <button class="btn btn-primary" id="story-go"><span>Слез надолу</span></button>
    </div>
  </div>
</section>

<!-- ============ ЕКРАН: РАЗПРЕДЕЛИТЕЛНАТА ШАПКА ============ -->
<section id="screen-sorting" class="screen">
  <div class="sorting-wrap">
    <div class="hat-stage">
      <div class="hat-shadow"></div>
      <div id="sorting-hat" class="sorting-hat"></div>
    </div>
    <div class="hat-speech" id="hat-speech"><span class="typed"></span><span class="caret"></span></div>
    <div class="hat-answers" id="hat-answers"></div>
    <div class="hat-progress" id="hat-progress"></div>
  </div>
</section>

<!-- ============ ЕКРАН: ИГРА ============ -->
<section id="screen-game" class="screen">

  <header id="hud">
    <div class="hud-left">
      <div class="hud-crest" id="hud-crest" title="Твоят дом"></div>
      <div class="hud-house">
        <span class="hud-name" id="hud-name" hidden></span>
        <span class="hud-house-name" id="hud-house-name">—</span>
        <span class="hud-chapter" id="hud-chapter">Зала 1 / 10</span>
      </div>
      <span class="act-badge" id="act-badge">I</span>
    </div>

    <div class="hud-center">
      <div class="timer" id="timer" title="Оставащо време">
        <svg viewBox="0 0 120 120" class="timer-ring" aria-hidden="true">
          <circle cx="60" cy="60" r="52" class="ring-bg"/>
          <circle cx="60" cy="60" r="52" class="ring-fg" id="ring-fg"/>
        </svg>
        <div class="timer-text"><span id="timer-value">60:00</span></div>
      </div>
    </div>

    <div class="hud-right">
      <div class="runes" id="runes-tray" title="Събрани руни"></div>
      <div class="grains-tray" id="grains-tray" title="Зърна пясък" hidden></div>
      <div class="hud-buttons">
        <button class="icon-btn" id="btn-hint" title="Подсказка (–2 минути)">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 12 2Z"/><path d="M9 21h6"/></svg>
          <span class="hint-count" id="hint-count">3</span>
        </button>
        <button class="icon-btn" id="btn-sound" title="Звук">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
        <button class="icon-btn" id="btn-notes" title="Бележник">
          <svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M9 12h7M9 16h7"/></svg>
        </button>
        <button class="icon-btn" id="btn-menu" title="Меню">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <nav id="progress-rail" aria-label="Напредък"></nav>

  <main id="room-root" tabindex="-1"></main>

  <div id="room-transition" aria-hidden="true">
    <div class="door door-l"><i class="door-edge"></i></div>
    <div class="door door-r"><i class="door-edge"></i></div>
    <div class="trans-motes"></div>
    <div class="trans-emblem"></div>
    <div class="transition-text"><span id="transition-title"></span></div>
  </div>
</section>

<!-- ============ ЕКРАН: СТАТИСТИКА ============ -->
<section id="screen-stats" class="screen">
  <div class="stats-page" id="stats-wrap"></div>
  <div class="flex flex-center mt-lg" style="padding-bottom:8vh">
    <button class="btn btn-primary" id="stats-home"><span>Към началото</span></button>
  </div>
</section>

<!-- ============ ЕКРАН: КРАЙ ============ -->
<section id="screen-end" class="screen">
  <div class="end-wrap" id="end-wrap"></div>
</section>

<!-- ============ МОДАЛИ ============ -->
<div class="modal-back" id="modal-back">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Затвори">&times;</button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="toast-tray" aria-live="polite"></div>

<script type="importmap">
{ "imports": { "three": "./js/lib/three.module.js" } }
</script>
<script type="module" src="js/game.js"></script>
<noscript><p style="color:#e8d9a8;padding:2rem;text-align:center;font-family:serif">Тази ескейп стая изисква включен JavaScript.</p></noscript>
</body>
</html>
